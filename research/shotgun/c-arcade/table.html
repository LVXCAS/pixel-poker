    const ry = slipY(S.NEED); rect(SLIP.x + SLIP.w, ry - 1, 4, 2, K['mustard-hi']); rect(SLIP.x + SLIP.w, ry + 1, 4, 1, K.ink);
    text(String(S.NEED), SLIP.x + SLIP.w + 6, ry - 21, 2, K['mustard-hi']); text('%', SLIP.x + SLIP.w + 34, ry - 9, 1, K['mustard-hi']);
  }
  if (!committed && hover !== null) rect(SLIP.x + 7, slipY(hover), SLIP.w - 9, 1, K.oxblood);
}

function dmd(f) {
  const { x, y, w, h } = DMD;
  frame9(x, y, w, h, { face: K['oxblood-lo'], hi: K.oxblood, lo: K.ink, drop: 2 });
  [[x + 3, y + 3], [x + w - 5, y + 3], [x + 3, y + h - 5], [x + w - 5, y + h - 5]].forEach(([sx, sy]) => { rect(sx, sy, 2, 2, K['mustard-lo']); px(sx, sy, K['mustard-hi']); });
  const ix = x + 6, iy = y + 5, iw = w - 12, ih = h - 10;
  rect(ix, iy, iw, ih, K['dmd-bg']);
  for (let j = 1; j < ih - 1; j += 2) for (let i = 1; i < iw - 1; i += 2) px(ix + i, iy + j, K['dmd-off']);
  const on = K['dmd-on'];
  let l1 = 'POT ' + fmt(potAt(f)), l2 = 'HAND 14 · 10/20', inv = false;
  if (f >= F.bet && f < F.decide) l2 = 'NINA BETS 100';
  if (f >= F.decide && f < F.commit) l2 = 'TO CALL 100';
  if (f >= F.commit && f < F.call1) l2 = f >= F.pour + 14 ? 'READ ' + read + ' TRUE ' + S.HAVE : 'READ ' + read + ' . . .';
  if (f >= F.call1 && f < F.river) l2 = 'YOU CALL 100';
  if (f >= F.river && f < F.shove) l2 = 'RIVER: TEN';
  if (f >= F.shove && f < F.call2) { l2 = 'NINA 1,360 IN'; if (f >= F.jolt && f < F.jolt + 36) { l1 = 'ALL IN!'; inv = Math.floor((f - F.jolt) / 6) % 2 === 0; } }
  if (f >= F.call2 && f < F.show) l2 = 'YOU CALL 1,140';
  if (f >= F.show && f < F.award) l2 = 'STRAIGHT WINS';
  if (f >= F.award) { l1 = '+' + fmt(2720 * ease(f - F.award, 30, 'out')); l2 = 'YOU WIN STRAIGHT'; inv = f < F.award + 36 && Math.floor((f - F.award) / 6) % 2 === 0; }
  if (inv) for (let j = 1; j < 18; j += 2) for (let i = 1; i < iw - 1; i += 2) px(ix + i, iy + j, on);
  const w1 = dotWidth(l1, 57, 2), w2 = dotWidth(l2, 35, 2);
  const cx = (s) => ix + 1 + 2 * Math.floor((iw - 2 - s) / 4);
  dotText(l1, cx(w1), iy + 3, 57, 2, inv ? K['dmd-bg'] : on);
  dotText(l2, cx(w2), iy + 21, 35, 2, on);
}

function coach(f) {
  const { x, y, w, h } = COACH;
  rect(x + 3, y + 3, w, h, K.ink);
  rect(x, y, w, h, K.cream); rect(x + w - 1, y, 1, h, K['cream-shade']);
  // cover flap, folded back: oxblood stock, mustard double rule, block letters
  const fh = 26; rect(x, y, w, fh, K.oxblood); rect(x, y + fh, w, 1, K.ink); rect(x, y + fh + 1, w, 1, K['cream-shade']);
  rect(x + 3, y + 3, w - 6, 1, K.mustard); rect(x + 3, y + fh - 4, w - 6, 1, K.mustard);
  rect(x + 3, y + 5, w - 6, 1, K['mustard-lo']); rect(x + 3, y + fh - 6, w - 6, 1, K['mustard-lo']);
  const tw = dotWidth('COACH', 57, 2); const tx = x + Math.floor((w - tw) / 2);
  rect(tx - 4, y + 6, tw + 8, 14, K.oxblood);
  dotText('COACH', tx + 1, y + 7, 57, 2, K.ink, 2); dotText('COACH', tx, y + 6, 57, 2, K.cream, 2);
  star(x + 10, y + 13); star(x + w - 15, y + 13);
  // striker strip + staple at the foot
  const sy = y + h - 16; rect(x, sy, w, 1, K.ink);
  for (let j = 1; j < 16; j++) for (let i = 0; i < w; i++) { const n = hash(i + 7, j + 3); px(x + i, sy + j, n < 0.33 ? K.grit : n < 0.7 ? K['grit-2'] : n < 0.94 ? '#4b3427' : K['cream-shade']); }
  rect(x + 14, sy - 6, 12, 2, K.staple); rect(x + 14, sy - 6, 2, 4, K.staple); rect(x + 24, sy - 6, 2, 4, K.staple); rect(x + 15, sy - 5, 10, 1, '#6d675c');
  rect(x + w - 26, sy - 6, 12, 2, K.staple); rect(x + w - 26, sy - 6, 2, 4, K.staple); rect(x + w - 16, sy - 6, 2, 4, K.staple); rect(x + w - 25, sy - 5, 10, 1, '#6d675c');
  dotText('CARD ROOM · OPEN ALL NIGHT', x + Math.floor((w - dotWidth('CARD ROOM · OPEN ALL NIGHT', 35, 1)) / 2), sy - 14, 35, 1, K.oxblood);
  const X = x + 6; let Y = y + fh + 4; const ink = K.ink, dim = '#8a7556';
  if (f < F.decide) { LOG.slice(0, f >= F.bet + 20 ? LOG.length : LOG.length - 1).forEach((l, i) => text(l, X, Y + i * 14, 1, l.startsWith('flop') || l.startsWith('turn') ? dim : ink)); return; }
  text('call 100 · pot 340', X, Y, 1, ink); Y += 14;
  if (f < F.commit) {
    text('your read? nick', X, Y, 1, K.oxblood); text('the odds ticket', X, Y + 14, 1, K.oxblood); Y += 34;
    rect(X, Y - 4, w - 12, 1, K['cream-shade']);
    LOG.slice(-4).forEach((l, i) => text(l, X, Y + i * 14, 1, l.startsWith('turn') ? dim : ink));
    return;
  }
  const off = Math.abs(S.HAVE - read);
  if (f < F.pour + 14) { text('read ' + read + ' · pouring', X, Y, 1, dim); return; }
  text('read ' + read + ' · off ' + off, X, Y, 1, off <= 4 ? K['green-ink'] : K.oxblood); Y += 18;
  if (f < F.verdict) return;
  if (f >= F.award) {
    stamp(X, Y, 'WON', K['green-ink'], f - F.award);
    const wl = wrap('Right call: 23% needed, 27% had. The ten was luck.', 17); wl.forEach((l, i) => text(l, X, Y + 36 + i * 13, 1, ink));
    ['Judge the call,', 'not the card.'].forEach((l, i) => text(l, X, Y + 40 + (wl.length + i) * 13, 1, K.oxblood));
    return;
  }
  stamp(X, Y, 'CALL', K.oxblood, f - F.verdict); text('+EV', X + 76, Y + 8, 1, K['green-ink']); text('thin', X + 76, Y + 20, 1, dim);
  Y += 38; let used = 0, shown = 0;
  for (const r of S.reasons) { const ls = wrap(r, 17); if (used + ls.length > 6) break; ls.forEach((l) => { text(l, X, Y, 1, ink); Y += 13; }); Y += 4; used += ls.length; shown++; }
  if (S.reasons.length - shown > 0) text((S.reasons.length - shown) + ' more · tab', x + w - 6, y + h - 50, 1, dim, 'right');
}
function star(x, y) { rect(x, y - 2, 1, 5, K.mustard); rect(x - 2, y, 5, 1, K.mustard); px(x - 1, y - 1, K['mustard-hi']); px(x + 1, y + 1, K['mustard-hi']); }
function stamp(x, y, word, col, n) { // rubber stamp: 2u frame, block letters, worn pixels; lands with a 1-frame slam offset
  const off = n === 0 ? -2 : n === 1 ? 1 : 0; const sx = x + off, sy = y + off;
  const tw = dotWidth(word, 57, 2) + 12; const tw2 = Math.max(tw, 66);
  rect(sx, sy, tw2, 2, col); rect(sx, sy + 28, tw2, 2, col); rect(sx, sy, 2, 30, col); rect(sx + tw2 - 2, sy, 2, 30, col);
  dotText(word, sx + Math.floor((tw2 - tw) / 2) + 6, sy + 8, 57, 2, col, 2);
  for (let i = 0; i < 26; i++) { const hx = Math.floor(hash(i, 91) * tw2), hy = Math.floor(hash(i, 17) * 30); px(sx + hx, sy + hy, K.cream); }
}

function button(x, y, w, h, kind, pressed) {
  const P = { fold: [K.oxblood, K['oxblood-hi'], K['oxblood-lo']], call: [K.mustard, K['mustard-hi'], K['mustard-lo']], raise: [K.green, K['green-hi'], K['green-lo']], tab: [K.cream, '#fff6df', K['cream-shade']] }[kind];
  const d = pressed ? 2 : 0;
  if (!pressed) rect(x + 2, y + h, w - 2, 2, K.ink);
  return frame9(x, y + d, w, h, { face: P[0], hi: P[1], lo: P[2] });
}
function actionBar(f) {
  const live = (f >= F.decide && f < F.call1 + 8) || (f >= F.shove + 14 && f < F.call2 + 6);
  const Y = 260; let x = 20;
  const pc = f >= F.call1 && f < F.call1 + 6 || f >= F.call2 && f < F.call2 + 6;
  const dimC = (c) => (live ? c : K['cream-shade']);
  let b = button(x, Y, 72, 34, 'fold'); dotText('F', b.x + 2, b.y + 2, 35, 1, K['cream-shade']); text('fold', b.x + 7, b.y + 1, 2, live ? K.cream : '#9a6a5a'); x += 78;
  b = button(x, Y, 152, 34, 'call', pc); dotText('C', b.x + 2, b.y + 2, 35, 1, K['mustard-lo']);
  const amt = f >= F.shove ? '1,140' : '100';
  text('call', b.x + 7, b.y + 1, 2, live ? K.ink : K['mustard-lo']); text(amt, b.x + 7 + 70, b.y + 1, 2, live ? K.oxblood : K['mustard-lo']); x += 158;
  b = button(x, Y, 92, 34, 'raise'); dotText('R', b.x + 2, b.y + 2, 35, 1, K['cream-shade']); text('raise', b.x + 7, b.y + 1, 2, live ? K.cream : K['green-hi']); x += 98;
  ['½', '¾', 'pot', 'max'].forEach((p) => { const w = p.length * 7 + 12; const bb = button(x, Y + 6, w, 22, 'tab'); text(p, bb.x + 5, bb.y + 2, 1, K.ink); x += w + 4; });
  void dimC;
}

function pot(f) {
  const v = potAt(f); const n = Math.min(9, Math.max(3, Math.round(v / 40)));
  if (f >= F.award + 2) { // pot slides to the hero
    const t = ease(f - F.award - 2, 14, 'out'); if (t >= 1) return;
    const p = arc(POT, { x: HERO.x + 30, y: HERO.y - 4 }, t, 10);
    chipStack(p.x, p.y, 8, true); chipStack(p.x + 14, p.y + 2, 6); return;
  }
  chipStack(POT.x, POT.y, Math.min(n, 6)); chipStack(POT.x + 14, POT.y + 3, Math.max(2, n - 3));
  if (v > 1000) { chipStack(POT.x - 28, POT.y + 1, Math.min(9, Math.round(v / 300)), true); chipStack(POT.x - 14, POT.y + 4, 5, true); }
}
function bets(f) {
  // Nina's 100: five chips slide from her plate, staggered, the stack knocks when the last one lands
  if (f >= F.bet && f < F.sweep + 12) {
    let landed = 0;
    for (let i = 0; i < 5; i++) {
      const n = f - (F.bet + i * 3); if (n < 0) continue;
      if (n >= 12) { landed++; continue; }
      const p = arc({ x: 262, y: 142 }, { x: NINA_BET.x, y: NINA_BET.y - 2 * i }, ease(n, 12, 'out'), 8); chipStack(p.x, p.y, 1);
    }
    let bx = NINA_BET.x, by = NINA_BET.y;
    if (f >= F.sweep) { const p = arc(NINA_BET, POT, ease(f - F.sweep, 12, 'in'), 6); bx = p.x; by = p.y; }
    if (landed) { const knock = [0, 2, 1, 0][f - (F.bet + 24)] || 0; chipStack(bx, by + knock, landed); }
    if (landed === 5 && f < F.call1) text('100', NINA_BET.x + 16, NINA_BET.y - 16, 1, K.cream);
  }
  // hero's call slides in from the plate
  if (f >= F.call1 + 4 && f < F.sweep + 12) {
    const n = f - F.call1 - 4; const tgt = f >= F.sweep ? arc({ x: 184, y: 200 }, POT, ease(f - F.sweep, 12, 'in'), 6) : { x: 184, y: 200 };
    const p = n < 12 ? arc({ x: 150, y: 222 }, { x: 184, y: 200 }, ease(n, 12, 'out'), 8) : tgt; chipStack(p.x, p.y, 5);
  }
  // Nina's shove: a mustard tower lurches in, then the hero's all-in
  if (f >= F.shove && f < F.call2 + 30) {
    const n = f - F.shove; const p = arc({ x: 262, y: 142 }, NINA_BET, ease(n, 14, 'in'), 4); chipStack(p.x, p.y, 10, true);
  }
  if (f >= F.call2 + 4 && f < F.call2 + 30) { const p = arc({ x: 150, y: 222 }, { x: 184, y: 200 }, ease(f - F.call2 - 4, 12, 'out'), 8); chipStack(p.x, p.y, 9, true); }
}

function render() {
  const f = frame;
  ctx.putImageData(roomImg, 0, 0);
  // felt print: the house's name in a lighter green, under the cards
  text("NO-LIMIT HOLD'EM", 82, 120, 1, K['green-print']);
  dotText('TABLE 4 · BLINDS 10/20', 96, 136, 35, 1, K['green-print']);
  // dealer button
  rect(DEALER.x - 5, DEALER.y - 4, 10, 10, K.cream); rect(DEALER.x - 4, DEALER.y - 5, 8, 12, K.cream); rect(DEALER.x - 4, DEALER.y + 7, 8, 1, K.ink);
  dotText('D', DEALER.x - 1, DEALER.y - 1, 35, 1, K.oxblood);
  // board: three on the flop already, turn and river arc from the button
  for (let i = 0; i < 3; i++) card(BOARD_X[i], BOARD_Y - lift(i), 'M', S.board[i], 1);
  if (f < F.river) { const sx = BOARD_X[4]; rect(sx, BOARD_Y, 22, 1, K['green-lo']); rect(sx, BOARD_Y + 29, 22, 1, K['green-lo']); rect(sx, BOARD_Y, 1, 30, K['green-lo']); rect(sx + 21, BOARD_Y, 1, 30, K['green-lo']); }
  dealt(3, 'turn', 'turnFlip'); dealt(4, 'river', 'riverFlip');
  pot(f);
  // seats
  SEATS.forEach((st) => {
    if (st.id === 'nina') {
      plate(st, f, { stack: ninaStackAt(f) });
      if (f < F.show) { cardBack(252, 136, 'S', 1); cardBack(262, 137, 'S', 1); }
      else { const fl = flipT(f - F.show); const draw = (i, X, Y) => (fl.face ? card(X, Y, 'S', S.nina[i], 1) : cardBack(X, Y, 'S', 1)); [[252, 136], [268, 137]].forEach(([X, Y], i) => (fl.s < 1 ? squash(() => draw(i, X, Y), X, Y, 14, 21, fl.s) : draw(i, X, Y))); }
    } else plate(st, f);
  });
  bets(f);
  // hero: cards, plate (neon trim while to act), marquee on the win
  const hl = after('show') ? 2 : 0;
  card(128, 170 - hl, 'M', S.hero[0], 2); card(152, 170 - hl, 'M', S.hero[1], 2);
  const toAct = f >= F.decide && f < F.call1;
  const win = f >= F.award + 14;
  const hp = plate({ id: 'you', name: 'YOU', stack: 0, x: HERO.x, y: HERO.y, hair: '#3a2418', collar: K['green-lo'], folded: false }, f, { stack: heroStackAt(f), toAct, win });
  if (f >= F.award + 16) { chipStack(HERO.x + hp.w + 14, HERO.y + 30, 9, true); chipStack(HERO.x + hp.w + 28, HERO.y + 32, 6); }
  if (win) marquee(HERO.x - 6, HERO.y - 6, hp.w + 12, hp.h + 14, 8, REDUCED ? null : Math.floor((f - F.award) / 4), 3);
  ticket(f);
  dmd(f);
  coach(f);
  actionBar(f);
}

// ---------- input
function toUnits(ev) { const r = cv.getBoundingClientRect(); return { x: Math.floor((ev.clientX - r.left) * (cv.width / r.width)) - R.ox, y: Math.floor((ev.clientY - r.top) * (cv.height / r.height)) - R.oy }; }
const deciding = () => frame >= F.decide + 8 && frame < F.commit;
const inSlip = (p) => p.x >= SLIP.x && p.x < SLIP.x + SLIP.w && p.y >= SLIP.y + SLIP.head && p.y < SLIP.y + SLIP.h;
cv.addEventListener('mousemove', (ev) => { const p = toUnits(ev); hover = deciding() && inSlip(p) ? Math.max(0, Math.min(100, SLIP.y + SLIP.base - p.y)) : null; cv.style.cursor = hover !== null ? 'crosshair' : 'default'; if (frozen) render(); });
function commit(v) { read = v; userRead = true; hover = null; frame = F.commit; if (frozen) frozen = REDUCED ? 'end' : null; if (REDUCED) frame = 260; render(); if (!frozen) requestAnimationFrame(tick); }
cv.addEventListener('click', (ev) => { const p = toUnits(ev); if (deciding() && inSlip(p)) commit(Math.max(0, Math.min(100, SLIP.y + SLIP.base - p.y))); });
addEventListener('keydown', (e) => { if (/^[0-9]$/.test(e.key) && deciding()) { digitBuf += e.key; if (digitBuf.length === 2) { commit(Number(digitBuf)); digitBuf = ''; } } });

let joltOn = false;
function jolt() { // screen jolt on the all-in: whole-unit offsets with decay, top impact tier only
  const n = frame - F.jolt; const J = [[0, 4], [0, -3], [3, 2], [-2, -1], [1, 1], [0, 0]];
  const o = !REDUCED && n >= 0 && n < J.length * 2 ? J[Math.floor(n / 2)] : [0, 0];
  const u = R.s / (window.devicePixelRatio || 1); cv.style.transform = o[0] || o[1] ? `translate(${o[0] * u}px, ${o[1] * u}px)` : ''; joltOn = !!(o[0] || o[1]);
}
function tick() {
  if (!frozen) {
    if (!(hover !== null && deciding())) frame++; // hold the decision while the pointer is on the ticket
    if (frame === F.commit && !userRead) read = S.demoRead;
    if (frame >= F.end) { frame = 0; userRead = false; read = S.demoRead; }
  }
  jolt(); render();
  if (!frozen) requestAnimationFrame(tick);
}
function start() { resize(); roomImg = paintRoom(TABLE); render(); if (!frozen) requestAnimationFrame(tick); }
addEventListener('resize', () => { resize(); roomImg = paintRoom(TABLE); render(); });
document.fonts.load('11px DM').then(start, start);
