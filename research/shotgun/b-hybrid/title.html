<script>
/* PIXEL HOLD'EM, direction B "Smoke & Felt": shared renderer.

'use strict';
const css = getComputedStyle(document.documentElement);
const K = new Proxy({}, { get: (o, n) => (n in o ? o[n] : (o[n] = css.getPropertyValue('--' + n).trim())) });

const FW = 480, FH = 300;
const R = { s: 1, W: FW, H: FH, ox: 0, oy: 0 };
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  R.s = Math.max(1, Math.floor(Math.min(innerWidth * dpr / FW, innerHeight * dpr / FH)));
  R.W = Math.ceil(innerWidth * dpr / R.s);
  R.H = Math.ceil(innerHeight * dpr / R.s);
  cv.width = R.W; cv.height = R.H;
  cv.style.width = (R.W * R.s / dpr) + 'px';
  cv.style.height = (R.H * R.s / dpr) + 'px';
  R.ox = Math.floor((R.W - FW) / 2);
  R.oy = Math.floor((R.H - FH) / 2);

}

let drawTarget = null;
const T = () => drawTarget || ctx;
function rect(x, y, w, h, c) { const t = T(); t.fillStyle = c; t.fillRect(R.ox + Math.round(x), R.oy + Math.round(y), w, h); }
function px(x, y, c) { rect(x, y, 1, 1, c); }
function hash(x, y, s) {
  let h = (Math.imul(x | 0, 374761393) + Math.imul(y | 0, 668265263) + Math.imul((s || 0) | 0, 1442695041)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16;

}

function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }

// ---------- type: Departure Mono at 11u x {1,2,4}, thresholded onto the unit grid.
// drop > 0 knocks pixels out of the glyphs: chalk on slate.
const CELL = 7;
const textCache = new Map();
function glyphs(str, k, color, drop) {
  const key = str + '|' + k + '|' + color + '|' + (drop || 0);
  if (textCache.has(key)) return textCache.get(key);
  const w = Math.max(1, str.length * CELL * k), h = 14 * k;
  const oc = document.createElement('canvas'); oc.width = w; oc.height = h;
  const o = oc.getContext('2d');
  o.font = (11 * k) + 'px DM'; o.fillStyle = color; o.textBaseline = 'alphabetic';
  o.fillText(str, 0, 11 * k);
  const id = o.getImageData(0, 0, w, h); const d = id.data;
  let seed = 0; for (let i = 0; i < str.length; i++) seed = (seed * 31 + str.charCodeAt(i)) | 0;
  for (let p = 0; p < w * h; p++) {
    let a = d[p * 4 + 3] >= 128 ? 255 : 0;
    if (a && drop && hash(p % w, (p / w) | 0, seed) < drop) a = 0;

  o.putImageData(id, 0, 0);
  textCache.set(key, oc);
  return oc;
}
function text(str, x, y, k, color, align, drop) {
  const g = glyphs(String(str), k || 1, color, drop);
  let dx = Math.round(x);
  if (align === 'right') dx -= g.width; else if (align === 'center') dx -= Math.round(g.width / 2);
  T().drawImage(g, R.ox + dx, R.oy + Math.round(y));
  return g.width;
}
function wrap(str, cells) {
  const words = str.split(/\s+/); const lines = []; let line = '';
  words.forEach((w) => {
    while (w.length > cells) { if (line) { lines.push(line); line = ''; } lines.push(w.slice(0, cells)); w = w.slice(cells); }
    const next = line ? line + ' ' + w : w;
    if (next.length > cells) { lines.push(line); line = w; } else line = next;
  });
  if (line) lines.push(line);
  return lines;
}

      if (c) rect(x + i * k, y + j * k, k, k, c);

  });
}

  const r = cv.getBoundingClientRect(); const y = Math.floor((ev.clientY - r.top) * (cv.height / r.height)) - R.oy;
  const i = Math.floor((y - 104) / 28); if (i >= 0 && i < MENU.length) { if (i === sel && i === 0) location.href = 'table.html'; sel = i; }
});

  ticks++;
  if (!REDUCED && ticks % 2 === 0) paintSmoke(ticks + 400, smokeOpts());
  render(); requestAnimationFrame(tick);
}
function build() {
  resize();
  ['calm', 'brownout', 'off'].forEach((m) => { rooms[m] = paintRoom(SCENE, m); });
  paintSmoke(400, smokeOpts());
}
function start() { build(); render(); requestAnimationFrame(tick); }
addEventListener('resize', () => { build(); render(); });
document.fonts.load('11px DM').then(start, start);
