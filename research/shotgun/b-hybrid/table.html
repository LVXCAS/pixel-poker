'use strict';
const css = getComputedStyle(document.documentElement);

const FW = 480, FH = 300;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  R.s = Math.max(1, Math.floor(Math.min(innerWidth * dpr / FW, innerHeight * dpr / FH)));
  R.W = Math.ceil(innerWidth * dpr / R.s);
  R.H = Math.ceil(innerHeight * dpr / R.s);
  cv.width = R.W; cv.height = R.H;
  cv.style.width = (R.W * R.s / dpr) + 'px';

function hash(x, y, s) {

// drop > 0 knocks pixels out of the glyphs: chalk on slate.
const CELL = 7;
const textCache = new Map();
function glyphs(str, k, color, drop) {
  const key = str + '|' + k + '|' + color + '|' + (drop || 0);
  if (textCache.has(key)) return textCache.get(key);
  const w = Math.max(1, str.length * CELL * k), h = 14 * k;
  const oc = document.createElement('canvas'); oc.width = w; oc.height = h;
  const o = oc.getContext('2d');
  o.font = (11 * k) + 'px DM'; o.fillStyle = color; o.textBaseline = 'alphabetic';
  o.fillText(str, 0, 11 * k);

  let seed = 0; for (let i = 0; i < str.length; i++) seed = (seed * 31 + str.charCodeAt(i)) | 0;

}
function text(str, x, y, k, color, align, drop) {
  const g = glyphs(String(str), k || 1, color, drop);

function wrap(str, cells) {
  const words = str.split(/\s+/); const lines = []; let line = '';

    const next = line ? line + ' ' + w : w;

  return lines;
}

  slipOff.width = w; slipOff.height = h + 2;
  const sv = { ox: R.ox, oy: R.oy }; R.ox = -x; R.oy = -y; drawTarget = slipOff.getContext('2d');
  slipFace(o); R.ox = sv.ox; R.oy = sv.oy; drawTarget = null;
  const dw = Math.max(1, Math.round(w * sX)); const X = x + dx + Math.round((w - dw) / 2);

function slipFace(o) {
  const { x, y, w, h } = SLIP; const NEED = o.need, HAVE = o.have; const face = !!o.face; const pour = o.pour;
  rect(x + 1, y + h, w - 1, 2, K.room);
  rect(x + 1, y, w - 2, h, K.paper); rect(x, y + 1, w, h - 2, K.paper);
  rect(x + w - 1, y + 1, 1, h - 2, K['paper-shade']); rect(x + 1, y + h - 1, w - 2, 1, K['paper-shade']);
  for (let i = 1; i < w - 1; i += 3) rect(x + i, y + 2, 1, 1, K['paper-shade']);
  if (face && pour > 0) rect(x + 1, slipY(pour), w - 2, pour, K.ink);
  if (face && o.showLoss && HAVE < NEED) {
    for (let p = HAVE + 1; p < NEED - 1; p++) for (let i = 1; i < w - 1; i++) if ((i + p) % 3 === 0) rect(x + i, slipY(p), 1, 1, K.loss);
  }
  for (let p = 0; p <= 100; p += 5) {
    const inInk = face && p <= pour; rect(x + 1, slipY(p), p % 10 === 0 ? 5 : 3, 1, inInk ? K['paper-shade'] : K.ink);
  }
  const ry = slipY(NEED); const c = face && NEED <= pour ? K['paper-shade'] : K['price-ink'];
  if (o.hollow) { rect(x + 6, ry - 1, w - 6, 1, c); rect(x + 6, ry + 1, w - 6, 1, c); } else rect(x + 6, ry - 1, w - 6, 2, c);
  if (face && o.showHave) {
    const inside = pour >= 24; const ty = inside ? slipY(pour) + 2 : slipY(pour) - 24;
    if (!inside) rect(x + 6, ty + 2, 28, 20, K.paper);
    text(String(HAVE), x + 6, ty - 3, 2, inside ? K.paper : K.ink);
  }
  if (o.read !== null && o.read !== undefined) {
    const ny = slipY(o.read); const t = T();
    [[-3, 1], [-2, 3], [-1, 5], [0, 6], [1, 5], [2, 3], [3, 1]].forEach(([dy, len]) => { t.clearRect(R.ox + x, R.oy + ny + dy, len, 1); rect(x + len, ny + dy, 1, 1, K['paper-shade']); });
  }
}
function priceTab(need) {
  const ry = slipY(need); const x = SLIP.x + SLIP.w;
  rect(x, ry - 1, 3, 2, K.bulb); rect(x, ry + 1, 3, 1, K.room);
  text(String(need), x + 5, ry - 21, 2, K.bulb); text('%', x + 33, ry - 9, 1, K.bulb);

// ---------- the slate on the wall (the coach). Wood frame, chalk, ghosts of last hand.
const BOARD = { x: 338, y: 0, w: 142, h: 252 };
let boardCv = null;
function paintBoard() {
  const c = document.createElement('canvas'); c.width = BOARD.w; c.height = BOARD.h;
  const o = c.getContext('2d'); const sv = { ox: R.ox, oy: R.oy }; R.ox = 0; R.oy = 0; drawTarget = o;
  const W = BOARD.w, Hh = BOARD.h;
  for (let y = 0; y < Hh; y++) for (let x = 0; x < W; x++) {
    const inSlate = x >= 4 && x < W - 4 && y >= 4 && y < Hh - 4;
    let col;
    if (inSlate) {

      const h = hash(x, y, 41);

      // eraser smear: a dithered band where last hand was wiped off
      const sm = Math.abs(y - (196 + Math.sin(x * 0.06) * 10));
      if (sm < 14 && BAYER[(y & 3) * 4 + (x & 3)] < 3 && h > 0.3) col = K['slate-ghost'];
    } else {
      const horiz = y < 4 || y >= Hh - 4;
      const g = horiz ? hash(Math.floor(x / 7), y, 5) : hash(x, Math.floor(y / 7), 6);
      col = g < 0.3 ? K['wood-lo'] : K.wood;
      if (x === 0 || y === 0 || x === W - 1 || y === Hh - 1) col = K['wood-lo'];
      if ((y === 1 && x > 0 && x < W - 1) || (x === 1 && y > 0 && y < Hh - 1)) col = K['wood-hi'];
      if (x === 3 && y >= 3 && y < Hh - 3) col = K['wood-hi'];
      if ((x === W - 4 || y === Hh - 4) && x >= 3 && y >= 3) col = K['wood-lo'];
      if (y === 3 && x >= 3 && x < W - 3) col = K['wood-lo'];
    }

  text('raise 80', 12, 186, 2, K['slate-ghost'], null, 0.55);
  text('hand 13', 74, 212, 1, K['slate-ghost'], null, 0.5);
  // nails
  [[1, 1], [W - 3, 1], [1, Hh - 3], [W - 3, Hh - 3]].forEach(([x, y]) => { rect(x, y, 2, 2, K.iron); px(x, y, K['wood-hi']); });
  drawTarget = null; R.ox = sv.ox; R.oy = sv.oy;

function chalkLine(x1, x2, y, color, seed) {
  for (let x = x1; x < x2; x++) {
    if (hash(x, y, seed) < 0.16) continue;
    const dy = hash(x >> 3, 3, seed) < 0.3 ? 1 : 0; px(x, y + dy, color);

}
function ctext(s, x, y, k, color) { return text(s, x, y, k, color, null, k > 1 ? 0.08 : 0.03); }
function drawCoach(f) {
  ctx.drawImage(boardCv, R.ox + BOARD.x, R.oy + BOARD.y);
  // ledge + a stub of chalk
  rect(336, 252, 144, 1, K['wood-hi']); rect(336, 253, 144, 3, K.wood); rect(336, 256, 144, 1, K['wood-lo']); rect(336, 257, 144, 1, K.room);
  rect(444, 250, 9, 2, K.chalk); rect(444, 251, 9, 1, K['chalk-dim']); px(456, 252, K.chalk); px(459, 252, K['chalk-dim']); px(431, 252, K['chalk-dim']);
  const X = 346; const C = K.chalk, D = K['chalk-dim'];
  ctext('hand 14 · 10/20', X, 8, 1, D);
  const logAt = (lines, y0, max) => {
    lines.slice(-max).forEach((l, i) => ctext(l, X, y0 + i * 14, 1, /^(flop|turn|river)/.test(l) ? D : C));
  };
  if (f >= F.win) {
    ctext('river 10♥ · show', X, 26, 1, D);
    ctext('nina K♠ Q♦', X, 40, 1, C);
    ctext('+360', X, 58, 2, C); chalkLine(X, X + 58, 83, C, 9);
    let y = 94;
    WIN_REASONS.forEach((r) => { wrap(r, 18).forEach((l) => { ctext(l, X, y, 1, C); y += 14; }); y += 7; });
    return;
  }
  if (f >= F.call) {
    const all = LOG.concat(LOG2.slice(0, f >= F.river + 14 ? 6 : f >= F.samFold ? 2 : 1));
    chalkLine(X, 470, 24, D, 3); logAt(all, 30, 15); return;
  }
  if (f < F.decide) {
    chalkLine(X, 470, 24, D, 3);
    logAt(f >= ninaLand(5) ? LOG : LOG.slice(0, -1), 30, 15); return;
  }
  ctext('call 120 · pot 240', X, 26, 1, C);

  const vf = f - F.verdict; if (vf < 0) return;

  ctext('call', X, 64, 2, C); chalkLine(X, X + 58, 89, C, 7);
  let y = 95, used = 0, shown = 0;
  for (const r of REASONS) {
    const ls = wrap(r, 18); if (used + ls.length > 9) break;
    ls.forEach((l) => { ctext(l, X, y, 1, C); y += 14; }); y += 7; used += ls.length; shown++;
  }
  if (REASONS.length - shown > 0) ctext((REASONS.length - shown) + ' more · tab', X, 233, 1, D);
  ctx.globalAlpha = 1;
}

// ---------- seats
function drawSeat(st, f) {
  const folded = st.folded || (st.id === 'samantha' && f >= F.samFold);
  const tc = folded ? K['text-dim'] : K.text;
  avatar(st.id, st.x, st.y + 1, st.hair, st.collar, folded, st.band);
  text(st.name, st.x + 16, st.y - 1, 1, tc);
  text(fmt(st.stack), st.x + 16, st.y + 13, 1, tc);
  if (st.id === 'samantha') {
    if (f < F.samFold) { cardBack(st.x + 56, st.y + 14, 'S', 1); cardBack(st.x + 64, st.y + 15, 'S', 1); }
    else if (f < F.samFold + 7) {
      const t = ease(f - F.samFold, 7, 'SWEEP');
      cardBack(Math.round(st.x + 60 + (170 - st.x - 60) * t), Math.round(st.y + 14 + (46 - st.y - 14) * t), 'S', 1);
    }
  }
  if (st.id === 'nina') ninaHand(st, f);
}
function ninaHand(st, f) {
  // a cigarette, an ember and a wisp that drifts into the cone
  const cx = st.x - 4, cy = st.y + 8;
  rect(cx + 1, cy, 3, 1, K.paper);
  const tk = REDUCED ? 0 : ticks; const drag = (tk % 150) < 12;
  px(cx, cy, drag ? K['chip-bone'] : K['ember']);
  for (let j = 0; j < 16; j++) {
    const wx = cx + Math.round(Math.sin((j + tk * 0.05) * 0.42) * 1.6 + j * 0.25);
    if (hash(j, Math.floor(tk / 6), 3) < j / 22) continue;
    px(wx, cy - 2 - j, j < 6 ? K['smoke-hi'] : K.smoke);
  }
  const pos = [{ x: 293, y: 76 }, { x: 308, y: 76 }];
  pos.forEach((p, i) => {
    const fl = flipScale(f - (F.show + i * 7));
    if (fl.face && fl.s >= 1) card(p.x, p.y, 'S', S.nina[i], K['paper-2'], 1);
    else squashed(p.x, p.y, 14, 20, fl.s, () => (fl.face ? card(p.x, p.y, 'S', S.nina[i], K['paper-2'], 1) : cardBack(p.x, p.y, 'S', 1)));
  });
}

// ---------- action bar: leather buttons with stitching
function drawActionBar(f) {
  const Y = 260; let x = 22; const live = f >= F.decide && f < F.call + 6;
  const tc = live ? K.text : K['text-dim']; const pressed = f >= F.call - 2 && f < F.call + 5;
  railButton(x, Y, 56, 32); text('f', x + 8, Y + 9, 1, K['text-dim']); text('fold', x + 19, Y + 9, 1, tc); x += 62;
  railButton(x, Y, 139, 32, pressed); text('c', x + 8, Y + 9, 1, pressed ? K.ink : K['text-dim']);
  text('call', x + 19, Y + 3, 2, pressed ? K.ink : tc); text('120', x + 89, Y + 3, 2, pressed ? K.ink : live ? K.bulb : K['text-dim']); x += 145;
  railButton(x, Y, 97, 32); text('r', x + 8, Y + 9, 1, K['text-dim']); text('raise', x + 19, Y + 3, 2, tc); x += 107;
  ['½', '¾', 'pot', 'max'].forEach((p) => { const w = p.length * 7 + 12; railButton(x, Y + 6, w, 20); text(p, x + 6, Y + 9, 1, tc); x += w + 6; });
}

// ---------- frame
function render() {
  const f = frame; const m = mood(f);
  ctx.putImageData(rooms[m], 0, 0);
  drawSmoke();
  // pot: the pile of clay above the board, count follows chips
  const nN = count(6, ninaLand, f), nH = count(6, heroLand, f);
  const pot = f < F.award ? 120 + 20 * (nN + nH) : 360 - 20 * counted(f);
  if (pot > 0) text('pot ' + pot, 40, 90, 1, K.text);
  // the pot is pushed to you as three stacks; they land together, then the dealer counts them in
  const pt = f >= F.award ? ease(f - F.award, PUSH, 'SLIDE') : 0;
  PILE.forEach((tw, t) => {
    const n = f < F.gather + 7 ? 2 : 6; const dst = AWARD_T[t];
    const x = PILE_X[t] + (dst.x - PILE_X[t]) * pt, b = PILE_BASE + (dst.base - PILE_BASE) * pt;
    const kn = [0, 1, 0][f - awardLand - 1] || 0;
    tower(x, b + kn, tw.slice(0, n), { squash: f === awardLand });
  });
  // board
  for (let i = 0; i < 3; i++) {
    const lift = f >= F.win && (i === 0 || i === 1) ? 2 : 0;
    card(BOARD_X[i], BOARD_Y - lift, 'M', S.board[i], paperTone(BOARD_X[i] + 12, BOARD_Y + 17, f), 1 + lift);
  }
  const slot = (x) => { rect(x, BOARD_Y, 24, 1, K['felt-rim']); rect(x, BOARD_Y + 33, 24, 1, K['felt-rim']); rect(x, BOARD_Y, 1, 34, K['felt-rim']); rect(x + 23, BOARD_Y, 1, 34, K['felt-rim']); };
  dealt(3, 0, F.turnFlip, f);
  if (f < F.river) slot(BOARD_X[4]);
  if (f >= F.river) dealt(4, F.river, F.riverFlip, f);
  // dealer button
  rect(DEALER.x - 4, DEALER.y + 2, 10, 8, K['chip-bone']); rect(DEALER.x - 3, DEALER.y + 1, 8, 10, K['chip-bone']);
  rect(DEALER.x - 3, DEALER.y + 11, 8, 1, K.room); text('d', DEALER.x + 1, DEALER.y - 1, 1, K.ink, 'center');
  SEATS.forEach((st) => drawSeat(st, f));
  // nina's bet: chips slide from her seat, squash on landing, tower knocks after the last
  if (f >= F.bet && f < F.gather + 7) {
    const gt = f >= F.gather ? ease(f - F.gather, 7, 'SWEEP') : 0;
    const tx = NINA_T.x + (PILE_X[2] - NINA_T.x) * gt, tb = NINA_T.base + (PILE_BASE - NINA_T.base) * gt;
    const knock = [0, 2, 1, 0][f - ninaLand(5)] || 0;
    if (nN > 0) tower(tx, tb + knock, Array(nN).fill('r'), { squash: f === ninaLand(nN - 1) });
    for (let i = nN; i < 6; i++) {
      const n = f - (F.bet + i * ST); if (n < 0) continue; const t = ease(n, CN, 'SLIDE');
      tower(Math.round(266 + (NINA_T.x - 266) * t), Math.round(92 + (NINA_T.base - 3 * i - 92) * t), ['r']);
    }
    if (f >= ninaLand(5) && f < F.gather) text('bet 120', NINA_T.x + 18, NINA_T.base - 16, 1, K.text);
  }
  // your call: chips leave your stack and stack up in front of you
  if (f >= F.call && f < F.gather + 7) {
    const gt = f >= F.gather ? ease(f - F.gather, 7, 'SWEEP') : 0;
    const tx = HERO_T.x + (PILE_X[0] - HERO_T.x) * gt, tb = HERO_T.base + (PILE_BASE - HERO_T.base) * gt;
    const knock = [0, 1, 0][f - heroLand(5)] || 0;
    if (nH > 0) tower(tx, tb + knock, Array(nH).fill('r'), { squash: f === heroLand(nH - 1) });
    for (let i = nH; i < 6; i++) {
      const n = f - heroLeave(i); if (n < 0) continue; const t = ease(n, CN, 'SLIDE');
      tower(Math.round(130 + (HERO_T.x - 130) * t), Math.round(224 + (HERO_T.base - 3 * i - 224) * t), ['r']);
    }
  }
  // hero cards
  HERO_C.forEach((p, i) => { const lift = f >= F.win ? 2 : 0; card(p.x, p.y - lift, 'M', S.hero[i], K.paper, 2 + lift); });
  const heroStack = 1240 - 20 * count(6, heroLeave, f) + 20 * counted(f);
  text('you', 124, 227, 1, K.text); text(fmt(heroStack), 152, 227, 1, f >= F.win ? K.text : K.text);
  // the slip
  if (f >= F.decide && f < F.gather + 7) {
    const after = f >= F.commit; const fl = flipScale(f - F.flip);
    const pour = after ? clamp((f - F.pour) * 2, 0, S.HAVE) : 0; const poured = after && (f - F.pour) * 2 >= S.HAVE;
    const dx = f >= F.gather ? Math.round(150 * ease(f - F.gather, 7, 'SWEEP')) : 0;
    slip({ need: S.NEED, have: S.HAVE, read: after ? read : null, face: after && fl.face, scaleX: after ? fl.s : 1, pour,
      showLoss: f >= F.hatch, showHave: poured, hollow: after && fl.face && f >= F.hatch }, dx);
    if ((!after || fl.s >= 1) && f < F.gather) priceTab(S.NEED);
    const guide = hover !== null ? hover : (!frozen && !userRead && f >= F.guide && f < F.commit) ? Math.round(52 - Math.min(22, (f - F.guide) * 0.6)) : null;
    if (!after && guide !== null) rect(SLIP.x + 6, slipY(guide), SLIP.w - 8, 1, K['text-dim']);
  }
  // showdown: the hand name, once, at 4x
  if (f >= F.win) {
    ctx.globalAlpha = Math.min(1, (f - F.win + 1) / 3);
    text('flush', 128, 110, 4, K.text); text('king high · hearts', 130, 154, 1, K['text-dim']);
    ctx.globalAlpha = 1;
  }
  drawCoach(f);
  drawActionBar(f);
}
function dealt(i, start, flipAt, f) {
  const n = f - start; const t = ease(n, 9, 'SLIDE');
  const tx = Math.round(DEALER.x + (BOARD_X[i] - DEALER.x) * t), ty = Math.round(DEALER.y + (BOARD_Y - DEALER.y) * t);
  const fl = flipScale(f - flipAt); const lift = f >= F.win && i === 4 ? 2 : 0;
  const tone = paperTone(BOARD_X[i] + 12, BOARD_Y + 17, f);
  if (fl.face && fl.s >= 1) { card(BOARD_X[i], BOARD_Y - lift, 'M', S.board[i], tone, 1 + lift); return; }
  squashed(tx, ty, 24, 35, fl.s, () => (fl.face ? card(tx, ty, 'M', S.board[i], tone, 1) : cardBack(tx, ty, 'M', 1)));
}

// ---------- input: hover the slip for a pencil guide, one click (or two digits) cuts the nick
function toUnits(ev) { const r = cv.getBoundingClientRect(); return { x: Math.floor((ev.clientX - r.left) * (cv.width / r.width)) - R.ox, y: Math.floor((ev.clientY - r.top) * (cv.height / r.height)) - R.oy }; }
const inSlip = (p) => p.x >= SLIP.x && p.x < SLIP.x + SLIP.w && p.y >= SLIP.y && p.y < SLIP.y + SLIP.h;
const deciding = () => frame >= F.decide && frame < F.commit;
const canRead = () => deciding() || frozen === 'reduced';
cv.addEventListener('mousemove', (ev) => {
  const p = toUnits(ev);
  hover = deciding() && inSlip(p) ? clamp(SLIP.y + SLIP.base - p.y, 0, 100) : null;
  const overCall = p.x >= 84 && p.x < 223 && p.y >= 260 && p.y < 292 && frame >= F.decide && frame < F.call;
  cv.style.cursor = hover !== null ? 'crosshair' : overCall ? 'pointer' : 'default';
  if (frozen) render();
});
cv.addEventListener('mouseleave', () => { hover = null; });
function commit(v) {
  read = v; userRead = true; hover = null; digitBuf = '';
  if (REDUCED || frozen) { frame = STATES.decision; render(); return; }
  frame = F.commit;
}
function call() { if (frame >= F.decide && frame < F.call) { if (frame < F.commit) commit(read); if (!REDUCED && !frozen) frame = F.call - 2; } }
cv.addEventListener('click', (ev) => {
  const p = toUnits(ev);
  if (canRead() && inSlip(p)) commit(clamp(SLIP.y + SLIP.base - p.y, 0, 100));
  else if (p.x >= 84 && p.x < 223 && p.y >= 260 && p.y < 292) call();
});
addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return;
  if (/^[0-9]$/.test(e.key) && canRead()) { digitBuf += e.key; if (digitBuf.length === 2) commit(Number(digitBuf)); }
  else if (e.key === 'c' || e.key === 'C') call();
});

function smokeOpts(f) {
  const m = mood(f);
  return { cx: 201, half0: 40, slope: 0.36, gain: m === 'warm' ? 1.25 : m === 'brownout' ? 0.75 : 1,
    skip: (x, y) => (x >= 336 && y < 259) || y >= 258 };
}
function tick() {
  ticks++;
  if (!frozen) {
    if (hold > 0) hold--;
    else if (hover !== null && deciding()) { /* the table waits while you hold the pencil */ }
    else {
      frame++;
      if (HOLDS[frame] && !REDUCED) hold = HOLDS[frame];
      if (frame >= F.end) { frame = 0; userRead = false; read = S.READ; }
    }
  }
  if (!REDUCED && ticks % 2 === 0) paintSmoke(ticks, smokeOpts(frame));
  render();
  requestAnimationFrame(tick);
}
function build() {
  resize();
  ['calm', 'brownout', 'warm'].forEach((m) => { rooms[m] = paintRoom(SCENE, m); });
  boardCv = paintBoard();
  paintSmoke(params.get('t') ? Number(params.get('t')) : 300, smokeOpts(frame));
}
function start() { build(); render(); if (!REDUCED || true) requestAnimationFrame(tick); }
addEventListener('resize', () => { build(); render(); });
document.fonts.load('11px DM').then(start, start);

</script>
