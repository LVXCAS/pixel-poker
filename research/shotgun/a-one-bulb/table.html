const FW = 480, FH = 300;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {

  R.s = Math.max(1, Math.floor(Math.min(innerWidth * dpr / FW, innerHeight * dpr / FH)));
  R.W = Math.ceil(innerWidth * dpr / R.s);
  R.H = Math.ceil(innerHeight * dpr / R.s);

let drawTarget = null;
function rect(x, y, w, h, c) { const t = drawTarget || ctx; t.fillStyle = c; t.fillRect(R.ox + Math.round(x), R.oy + Math.round(y), w, h); }

// deterministic hash in [0,1): used for chalk grain, dust and ghosts. Never random per frame.
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

const CELL = 7;
const textCache = new Map();

  // the teacher's underline: two strokes, one unit apart where the chalk lifted
  const uw = S.verdict.length * 14;
  rect(CX, 79, Math.round(uw * 0.55), 1, K['coach-dim']); rect(CX + Math.round(uw * 0.55) + 1, 80, uw - Math.round(uw * 0.55) + 3, 1, K['coach-dim']);
  let y = 90, used = 0, shown = 0; const LINES = 9;
  for (const rs of S.reasons) {
    const ls = wrap(rs, 19);
    if (used + ls.length > LINES) break;
    ls.forEach((l) => { coachText(l, y); y += 14; });
    y += 7; used += ls.length; shown++;
  }
  const rest = S.reasons.length - shown;
  if (rest > 0) coachText(rest + ' more · tab', 224, K['coach-dim']);
  ctx.globalAlpha = 1;
}

// ---------- action bar
let BTNS = [];
function drawActionBar(f) {
  BTNS = [];
  if (f >= F.name && !folded) { // showdown: the bar gives its row to the hand
    const n = f - F.name;
    if (n >= 0) {
      text('flush', 20, 251, 4, K.text);
      if (f >= F.toss + 8) { text('you win', 178, 267, 1, K['text-dim']); text('390', 234, 256, 2, K.text); }
      text('king high · 9♥ 8♥', 178, 284, 1, K['text-dim']);
    }
    return;
  }
  const live = deciding(f) || (f >= F.commit && f < F.call + 6);
  const Y = 260; let x = 22;
  const isP = (id) => pressed === id && f <= pressedUntil;
  const btn = (id, w, h, yy) => { const p = isP(id); railButton(x, yy, w, h, p); BTNS.push({ id, x, y: yy, w, h }); return p; };
  const ink = (p, c) => (p ? K.ink : live ? c : K['text-dim']);
  let p = btn('fold', 56, 32, Y); text('f', x + 8, Y + 9, 1, p ? K.ink : K['text-dim']); text('fold', x + 19, Y + 9, 1, ink(p, K.text)); x += 62;
  p = btn('call', 139, 32, Y); text('c', x + 8, Y + 9, 1, p ? K.ink : K['text-dim']);
  text('call', x + 19, Y + 3, 2, ink(p, K.text)); text('120', x + 19 + 70, Y + 3, 2, ink(p, K.bulb)); x += 145;
  p = btn('raise', 97, 32, Y); text('r', x + 8, Y + 9, 1, p ? K.ink : K['text-dim']); text('raise', x + 19, Y + 3, 2, ink(p, K.text)); x += 107;
  ['½', '¾', 'pot', 'max'].forEach((lab, i) => {
    const w = lab.length * 7 + 12; const id = 'preset' + i; const sel = preset === i;
    railButton(x, Y + 6, w, 20, sel || isP(id)); BTNS.push({ id, x, y: Y + 6, w, h: 20 });
    text(lab, x + 6, Y + 9, 1, sel || isP(id) ? K.ink : live ? K.text : K['text-dim']); x += w + 6;
  });
}

// ---------- seats
function drawSeat(st, f) {
  const dim = st.folded; const tc = dim ? K['text-dim'] : K.text;
  const acting = st === NINA && f >= F.ninaAct && f < F.betStart;
  avatar(st.id, st.x + (acting ? 2 : 0), st.y + 1 + (acting ? 1 : 0), st.hair, st.collar, st.folded);
  text(st.name, st.x + 16, st.y - 1, 1, tc);
  let stack = st.stack;
  if (st === NINA) stack -= CHIP * Math.max(0, Math.min(6, Math.floor((f - F.betStart) / F.stagger) + 1));
  text(fmt(stack), st.x + 16, st.y + 13, 1, tc);
  if (acting) { const left = 1 - (f - F.ninaAct) / (F.betStart - F.ninaAct); rect(st.x + 16, st.y + 12, Math.max(1, Math.round(56 * left)), 1, K['text-dim']); }
  if (!st.folded) {
    if (st === NINA && f >= F.show) {
      cardTurning(st.x + 56, st.y + 14, 'S', S.nina[0], K['paper-2'], 1, f - F.show);
      cardTurning(st.x + 72, st.y + 14, 'S', S.nina[1], K['paper-2'], 1, f - F.show - 7);
    } else { cardBack(st.x + 56, st.y + 14, 'S', 1); cardBack(st.x + 64, st.y + 15, 'S', 1); }
  }
}

function landedChips(f, start) { return Math.max(0, Math.min(6, Math.floor((f - start - F.chipN) / F.stagger) + 1)); }
function potTowers(n, f) {
  const per = [0, 0, 0]; for (let i = 0; i < n; i++) per[Math.min(2, Math.floor(i / 5))]++;
  POT_TOWERS.forEach((x, i) => tower(x, POT_BASE, per[i]));
}
function warmOffset(f) {
  const n = f - F.toss; if (n < 0 || n >= F.warmN) return 0;
  const steps = [4, 8, 12]; if (n < 9) return steps[Math.floor(n / 3)]; if (n >= F.warmN - 9) return steps[2 - Math.floor((n - (F.warmN - 9)) / 3)]; return 12;
}

function render() {
  const f = frame;
  const brown = f >= F.brown && f < F.brown + F.brownN;
  ctx.putImageData(room(true, brown ? 2 : 3, warmOffset(f)), 0, 0);

  // ----- chips and the pot
  const ninaIn = landedChips(f, F.betStart), heroIn = f >= F.heroChips && !folded ? landedChips(f, F.heroChips) : 0;
  const gathered = f >= F.gather + F.gatherN && !folded;
  const tossLaunched = f >= F.toss ? Math.min(TOSS_N, Math.floor((f - F.toss) / F.tossStagger) + 1) : 0;
  const tossLanded = f >= F.toss ? Math.max(0, Math.min(TOSS_N, Math.floor((f - F.toss - F.tossN) / F.tossStagger) + 1)) : 0;
  const sumTo = (n) => TOSS_VAL.slice(0, n).reduce((a, b) => a + b, 0);
  let pot = S.potBefore + CHIP * (ninaIn + heroIn) - sumTo(tossLaunched);
  if (gathered) POT_TOWERS.forEach((x, i) => { if (i >= tossLaunched) tower(x, POT_BASE, TOSS_CHIPS[i]); }); else tower(POT_TOWERS[0], POT_BASE, 5);
  if (pot > 0) text('pot ' + fmt(pot), 105, 55, 1, K.text);

  // ----- board
  for (let i = 0; i < 3; i++) {
    const lift = f >= F.lift && (i === 0 || i === 1) && !folded ? 2 : 0;
    card(BOARD_X[i], BOARD_Y - lift, 'M', S.board[i], poolTone(BOARD_X[i] + 11, BOARD_Y + 15), 1);
  }
  const slot = (x) => { rect(x, BOARD_Y, 22, 1, K['felt-rim']); rect(x, BOARD_Y + 29, 22, 1, K['felt-rim']); rect(x, BOARD_Y, 1, 30, K['felt-rim']); rect(x + 21, BOARD_Y, 1, 30, K['felt-rim']); };
  const dealt = (idx, dealAt, flipAt, lift) => {
    const t = ease(f - dealAt, 9, 'SLIDE');
    const tx = Math.round(DEALER.x + (BOARD_X[idx] - DEALER.x) * t), ty = Math.round(DEALER.y + (BOARD_Y - DEALER.y) * t) - lift;
    cardTurning(tx, ty, 'M', S.board[idx], poolTone(BOARD_X[idx] + 11, BOARD_Y + 15), 1, f - flipAt);
  };
  if (f < F.riverDeal || folded) slot(BOARD_X[4]);
  dealt(3, F.turnDeal, F.turnFlip, 0);
  if (f >= F.riverDeal && !folded) { const ln = f - (F.riverFlip + 8); dealt(4, F.riverDeal, F.riverFlip, f >= F.lift ? 2 : (ln >= 0 && ln < 3 ? [0, 1, 0][ln] : 0)); }

  // dealer button
  rect(DEALER.x - 4, DEALER.y + 2, 10, 8, K['clay-bone']); rect(DEALER.x - 3, DEALER.y + 1, 8, 10, K['clay-bone']);
  rect(DEALER.x - 3, DEALER.y + 11, 8, 1, K.room); text('d', DEALER.x + 1, DEALER.y - 1, 1, K.ink, 'center');

  SEATS.forEach((s) => drawSeat(s, f));

  // nina's bet: chips slide in one by one, the tower grows per landing, T2 knock after the last
  const gT = f >= F.gather ? ease(f - F.gather, F.gatherN, 'SWEEP') : 0;
  if (f >= F.betStart && !gathered) {
    const knock = [0, 2, 1, 0][f - ninaLast] || 0;
    const gx = Math.round(NINA_TOWER.x + (POT_TOWERS[2] - NINA_TOWER.x) * gT), gy = Math.round(NINA_TOWER.base + (POT_BASE - NINA_TOWER.base) * gT);
    tower(gx, gy + knock, ninaIn);
    for (let i = ninaIn; i < 6; i++) {
      const n = f - (F.betStart + i * F.stagger); if (n < 0) continue;
      const sy = Math.round(84 + (NINA_TOWER.base - 2 * (i + 1) - 84) * ease(n, F.chipN, 'SLIDE'));
      tower(NINA_TOWER.x, sy + 2, 1);
    }
    if (f >= ninaLast && f < F.gather) text('bet 120', NINA_TOWER.x + 16, NINA_TOWER.base - 14, 1, K.text);
  }
  // the hero's call: six chips from the stack to the tower left of the cards
  if (f >= F.heroChips && !gathered && !folded) {
    const gx = Math.round(HERO_TOWER.x + (POT_TOWERS[1] - HERO_TOWER.x) * gT), gy = Math.round(HERO_TOWER.base + (POT_BASE - HERO_TOWER.base) * gT);
    tower(gx, gy, heroIn);
    for (let i = heroIn; i < 6; i++) {
      const n = f - (F.heroChips + i * F.stagger); if (n < 0) continue;
      const t = ease(n, F.chipN, 'SLIDE');
      tower(Math.round(140 + (HERO_TOWER.x - 140) * t), Math.round(232 + (HERO_TOWER.base - 2 * i - 232) * t), 1);
    }
  }
  // pot award: TOSS, x linear, y on a 12u parabola, no overshoot; each landing adds to the stack
  if (f >= F.toss && !folded) {
    for (let i = 0; i < tossLaunched; i++) {
      const n = f - (F.toss + i * F.tossStagger); const t = Math.max(0, Math.min(1, n / F.tossN)); const w = WIN_TOWERS[i];
      if (t >= 1) { const kn = [0, 1, 0][n - F.tossN] || 0; tower(w.x, w.base + kn, TOSS_CHIPS[i]); continue; }
      tower(Math.round(POT_TOWERS[i] + (w.x - POT_TOWERS[i]) * t), Math.round(POT_BASE + (w.base - POT_BASE) * t - 48 * t * (1 - t)), TOSS_CHIPS[i]);
    }
  }
  // ----- hero
  const heroLift = f >= F.lift && !folded ? 2 : 0;
  if (folded) {
    const n = f - F.call; const t = ease(n, 7, 'SWEEP');
    if (t < 1) { cardBack(Math.round(128 + (157 - 128) * t), Math.round(174 + (90 - 174) * t), 'M', 2); }
  } else {
    card(128, 174 - heroLift, 'M', S.hero[0], K.paper, 2);
    card(152, 174 - heroLift, 'M', S.hero[1], K.paper, 2);
  }
  let hs = S.heroStack - CHIP * (f >= F.heroChips && !folded ? Math.max(0, Math.min(6, Math.floor((f - F.heroChips) / F.stagger) + 1)) : 0) + sumTo(tossLanded);
  text('you', 128, 227, 1, K.text); text(fmt(hs), 128 + 28, 227, 1, K.text);
  if (deciding(f)) { // the hero's clock: the only loop in the game
    const left = 1 - (f - F.decide) / (F.commit - F.decide);
    rect(128, 241, Math.max(1, Math.round(70 * left)), 1, K['text-dim']);
  }

  // ----- the slip
  if (f >= F.decide) {
    const after = f >= F.commit;
    const fl = flipScale(after ? f - F.flip : -1);
    const pour = after ? Math.max(0, Math.min(S.HAVE, (f - F.pour) * 2)) : 0;
    const poured = after && f >= pourDone;
    const r = readAt(f);
    let pencil = null;
    if (deciding(f)) { if (hover !== null) pencil = hover; else if (digitBuf) pencil = Number(digitBuf) * 10; }
    slip({ need: S.NEED, have: S.HAVE, read: r, face: after && fl.face, scaleX: fl.s, pour, showLoss: poured, showHave: poured, pencil });
    if (!after || fl.s >= 1) priceTab(S.NEED);
  }

  drawCoach(f);
  drawActionBar(f);
}

// ---------- input
function commit(v) {
  if (!deciding(frame)) return;
  read = v; userRead = v !== null; hover = null; digitBuf = '';
  frame = F.commit;
  if (frozen) { frozen = null; if (REDUCED) { frame = verdictAt + 4; render(); return; } requestAnimationFrame(tick); }
}
function press(id) { pressed = id; pressedUntil = frame + 6; }
let pendingAct = null;
function act(kind) {
  press(kind);
  if (kind === 'raise' || frame >= F.call || folded) { if (frozen) render(); return; }
  pendingAct = kind;
  if (deciding(frame)) commit(userRead ? read : null);
  if (REDUCED) { if (kind === 'fold') { folded = true; frame = F.call + 30; } else frame = STATES.end; pendingAct = null; render(); return; }
  if (frozen) { frozen = null; requestAnimationFrame(tick); }
}
cv.addEventListener('mousemove', (ev) => {
  const p = toUnits(ev);
  hover = deciding(frame) && inBox(p, SLIP) ? Math.max(0, Math.min(100, SLIP.y + SLIP.base - p.y)) : null;
  const overBtn = BTNS.some((b) => inBox(p, b));
  cv.style.cursor = hover !== null ? 'crosshair' : overBtn ? 'pointer' : 'default';
  if (frozen) render();
});
cv.addEventListener('mouseleave', () => { hover = null; if (frozen) render(); });
cv.addEventListener('click', (ev) => {
  const p = toUnits(ev);
  if (deciding(frame) && inBox(p, SLIP)) { commit(Math.max(0, Math.min(100, SLIP.y + SLIP.base - p.y))); return; }
  const b = BTNS.find((bb) => inBox(p, bb)); if (!b) return;
  if (b.id.startsWith('preset')) { preset = Number(b.id.slice(6)); press(b.id); if (frozen) render(); return; }
  act(b.id);
});
addEventListener('keydown', (e) => {
  if (e.target && e.target.tagName === 'INPUT') return; // the raise input owns digits while open
  if (/^[0-9]$/.test(e.key) && deciding(frame)) {
    digitBuf += e.key; if (digitBuf.length === 2) commit(Number(digitBuf)); else if (frozen) render();
    return;
  }
  const k = e.key.toLowerCase();
  if (k === 'f') act('fold'); else if (k === 'c') act('call'); else if (k === 'r') act('raise');
});

function reset() { pendingAct = null; frame = 0; read = null; userRead = false; digitBuf = ''; folded = false; preset = null; }
function tick() {
  if (frozen) return;
  const holding = (frame === F.commit - 1 && (hover !== null || digitBuf)) && !userRead;
  if (!holding) frame++;
  if (pendingAct && frame >= verdictAt + 12 && frame < F.call) frame = F.call;
  if (frame === F.call) { if (pendingAct === 'fold') folded = true; else press('call'); pendingAct = null; }
  if (frame >= F.end || (folded && frame >= F.call + 60)) reset();
  render();
  requestAnimationFrame(tick);
}
function start() { resize(); clearRooms(); slateImg = paintSlate(); render(); if (!frozen) requestAnimationFrame(tick); }
let started = false;
addEventListener('resize', () => { if (started) { resize(); clearRooms(); slateImg = paintSlate(); render(); } });
document.fonts.load('11px DM').then(() => { started = true; start(); }, () => { started = true; start(); });

</script>
</body>
