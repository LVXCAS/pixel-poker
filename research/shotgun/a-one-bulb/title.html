const FW = 480, FH = 300;

const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

function resize() {
  const dpr = window.devicePixelRatio || 1;
  R.s = Math.max(1, Math.floor(Math.min(innerWidth * dpr / FW, innerHeight * dpr / FH)));
  R.W = Math.ceil(innerWidth * dpr / R.s);
  R.H = Math.ceil(innerHeight * dpr / R.s);

  cv.style.width = (R.W * R.s / dpr) + 'px';

let drawTarget = null;
function rect(x, y, w, h, c) { const t = drawTarget || ctx; t.fillStyle = c; t.fillRect(R.ox + Math.round(x), R.oy + Math.round(y), w, h); }

// deterministic hash in [0,1): used for chalk grain, dust and ghosts. Never random per frame.
function hash(x, y) { let h = (x * 374761393 + y * 668265263) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }

const CELL = 7;
const textCache = new Map();

}
function cardTurning(x, y, size, c, lit, drop, n) {
  const fl = flipScale(n); const M = size === 'M'; const w = M ? 22 : 14, h = M ? 30 : 19;
  if (fl.s >= 1) { if (fl.face) card(x, y, size, c, lit, drop); else cardBack(x, y, size, drop); return; }
  if (fl.s <= 0.01) return;
  const oc = offscreen(x, y, w, h + 2, () => { if (fl.face) card(x, y, size, c, lit, drop); else cardBack(x, y, size, drop); });
  const dw = Math.max(1, Math.round(w * fl.s));
  blit(oc, x + Math.round((w - dw) / 2), y, dw);
}

// clay chip tower: n chips, base at (x, yBase). 12 wide, 2u per chip.
function tower(x, yBase, n) {
  if (n <= 0) return;
  const top = yBase - n * 2;
  for (let i = 0; i < n; i++) {
    const y = yBase - (i + 1) * 2;
    rect(x, y, 12, 2, K['clay-red']);
    rect(x, y + 1, 12, 1, K['clay-edge']);
    [1, 5, 9].forEach((sx) => rect(x + sx + (i % 2), y, 2, 1, K['clay-bone']));
  }
  rect(x + 2, top - 3, 8, 1, K['clay-red']); rect(x + 1, top - 2, 10, 2, K['clay-red']);
  rect(x + 3, top - 2, 6, 1, K['clay-bone']);
  rect(x, yBase, 12, 1, K.room);
}
function chip(x, y) { // a single chip seen in flight: top face 12x4 + edge
  rect(x + 2, y, 8, 1, K['clay-red']); rect(x + 1, y + 1, 10, 2, K['clay-red']); rect(x + 3, y + 1, 6, 1, K['clay-bone']);
  rect(x, y + 3, 12, 2, K['clay-red']); rect(x, y + 4, 12, 1, K['clay-edge']);
}

// avatars 12x12: 'h' hair/hat, 'f' skin, 'F' skin shade, 'c' collar, 'e' eye
const AV = {
  pete: ['...hhhhh....','..hhhhhhh...','..hfffffhh..','..ffffffF...','..fefffeF...','..ffffffF...','...ffffF....','...fFFFF....','..cccccccc..','.cccccccccc.','ccccccccccc.','cccccccccccc'],
  carl: ['............','...hhhhhh...','..hhhhhhhh..','.hhhhhhhhhh.','..ffffffF...','..fefffeF...','..ffffffF...','...fffFF....','..ccFFcccc..','.cccccccccc.','ccccccccccc.','cccccccccccc'],
  betty:['..hhhhhhh...','.hhhhhhhhh..','.hhfffffhhh.','.hffffffFhh.','.hfeffefFhh.','.hffffffFhh.','.hhffffFhh..','.hh.FFF.hh..','..cccccccc..','.cccccccccc.','ccccccccccc.','cccccccccccc'],
  sam:  ['...hhhhhhh..','..hhhhhhhhh.','.hhffffffhhh','..ffffffF.hh','..fefffeF.hh','..ffffffF..h','..ffffffF...','...fFFFF....','..cccccccc..','.cccccccccc.','ccccccccccc.','cccccccccccc'],
  nina: ['...hhhhhh...','..hhhhhhhh..','.hhffffffh..','.hffffffFh..','.hfeffefFh..','.hfffffFFh..','..hffffFh...','..h.FFF.h...','..cccccccc..','.cccccccccc.','ccccccccccc.','cccccccccccc'],
};
const BACKFRAME = ['............','...hhhhhh...','..hhhhhhhh..','.hhhhhhhhhh.','.hhhhhhhhhh.','.hhhhhhhhhh.','..hhhhhhhh..','...hhhhhh...','..cccccccc..','.cccccccccc.','ccccccccccc.','cccccccccccc'];
function avatar(id, x, y, hair, collar, back, unlit) {
  const map = unlit ? { h: hair, f: hair, F: hair, c: collar, e: hair } : { h: hair, f: K.skin, F: K['skin-shade'], c: collar, e: K.ink };
  bitmap(back ? BACKFRAME : AV[id], x, y, map);
}

// ---------- the room: felt ellipse, rail, light pool. Painted per light state and cached.
const TABLE = { cx: 168, cy: 128, rx: 148, ry: 88, rail: 8, wear: { x: 158, y: 104 } };
const POOL = { cx: 201, cy: 162, aspect: 1.3, r1: 58, r2: 100 };
function band(d, r1, r2, x, y) {
  const tw = ((x + y) & 3);
  const step = (r) => { if (d < r - 3) return 0; if (d >= r + 3) return 1; return d < r ? (tw === 0 ? 1 : 0) : (tw === 0 ? 0 : 1); };
  return step(r1) + step(r2);
}
// lvl: 3 full, 2 brownout (one band down), 0 off. warm: units added to both pool radii (the filament runs hot)
function paintRoom(lightOn, lvl, warm) {
  if (lvl === undefined) lvl = 3; warm = warm || 0;
  const img = ctx.createImageData(R.W, R.H); const d = img.data;
  const hex = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const FELT = [K['felt-hot'], K.felt, K['felt-rim'], K['felt-rim']].map(hex);
  const DARKFELT = hex('#0f1a14');
  const RAIL = [K['rail-hi'], K.rail, K.rail].map(hex);
  const RAILDARK = hex(K['rail-dark']);
  const ROOM = hex(K.room), ROOM2 = hex(K['room-2']);
  const r1 = POOL.r1 + warm, r2 = POOL.r2 + warm;
  for (let Y = 0; Y < R.H; Y++) for (let X = 0; X < R.W; X++) {
    const x = X - R.ox, y = Y - R.oy;
    const ex = (x - TABLE.cx) / TABLE.rx, ey = (y - TABLE.cy) / TABLE.ry;
    const e = Math.sqrt(ex * ex + ey * ey);
    const rex = (x - TABLE.cx) / (TABLE.rx + TABLE.rail), rey = (y - TABLE.cy) / (TABLE.ry + TABLE.rail);
    const re = Math.sqrt(rex * rex + rey * rey);
    const pd = Math.sqrt(((x - POOL.cx) / POOL.aspect) ** 2 + (y - POOL.cy) ** 2);
    let b = band(pd, r1, r2, x, y);
    if (!lightOn) b = 3; else b = Math.min(3, b + (3 - lvl));
    let c;
    if (e <= 1) c = b >= 3 ? DARKFELT : FELT[b];
    else if (re <= 1) {
      const edge = (e - 1) * TABLE.rx;
      if (edge < 1.2) c = ROOM; else c = !lightOn || b >= 3 ? RAILDARK : RAIL[Math.min(2, b)];
      if (re > 0.985 && y < TABLE.cy && lightOn && b < 3) c = RAIL[0];
    } else {
      const out = (re - 1) * (TABLE.rx + TABLE.rail);
      const tw = (x + y) & 3;
      c = !lightOn ? ROOM : out < 4 ? ROOM2 : out < 8 ? (tw === 0 ? ROOM : ROOM2) : out < 12 ? (tw === 0 ? ROOM2 : ROOM) : ROOM;
    }
    const i = (Y * R.W + X) * 4; d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2]; d[i + 3] = 255;
  }
  if (lightOn && TABLE.wear) { // the dealer's push zone: one step lighter, twill-dithered edge
    const wx = TABLE.wear.x, wy = TABLE.wear.y; const c = hex(K.felt);
    for (let j = 0; j < 8; j++) for (let i = 0; i < 20; i++) {
      const ex = (i - 9.5) / 10, ey = (j - 3.5) / 4; const r = ex * ex + ey * ey;
      if (r < 0.45 || (r < 1 && ((wx + i + wy + j) & 3) === 0)) {
        const k = ((R.oy + wy + j) * R.W + R.ox + wx + i) * 4;
        d[k] = c[0] + 6; d[k + 1] = c[1] + 9; d[k + 2] = c[2] + 6;
      }
    }
  }
  return img;
}
const roomCache = {};
function room(on, lvl, warm) { const k = on + ':' + lvl + ':' + (warm || 0); return roomCache[k] || (roomCache[k] = paintRoom(on, lvl, warm)); }
function clearRooms() { for (const k in roomCache) delete roomCache[k]; }
function poolTone(x, y) {
  const pd = Math.sqrt(((x - POOL.cx) / POOL.aspect) ** 2 + (y - POOL.cy) ** 2);
  return pd < POOL.r1 ? K.paper : K['paper-2'];
}

// ---------- the slip (DESIGN.md section 5)
const SLIP = { x: 184, y: 108, w: 36, h: 108, base: 104 };
function slipY(p) { return SLIP.y + SLIP.base - p; }
function slip(o) {
  const { x, y, w, h } = SLIP;
  const scaleX = o.scaleX === undefined ? 1 : o.scaleX;
  if (scaleX <= 0.01) return;
  const oc = offscreen(x, y, w, h + 2, () => slipFace(o));
  const dw = Math.max(1, Math.round(w * scaleX));
  blit(oc, x + Math.round((w - dw) / 2), y, dw);
}
function slipFace(o) {
  const { x, y, w, h } = SLIP;
  const NEED = o.need, HAVE = o.have, READ = o.read;
  const face = !!o.face; const pour = o.pour === undefined ? HAVE : o.pour;
  rect(x + 1, y + h, w - 1, 2, K.room);
  rect(x + 1, y, w - 2, h, K.paper); rect(x, y + 1, w, h - 2, K.paper);
  rect(x + w - 1, y + 1, 1, h - 2, K['paper-shade']); rect(x + 1, y + h - 1, w - 2, 1, K['paper-shade']);
  for (let i = 1; i < w - 1; i += 3) rect(x + i, y + 2, 1, 1, K['paper-shade']); // torn off a pad
  if (face && pour > 0) rect(x + 1, slipY(pour), w - 2, pour, K.ink);
  if (face && o.showLoss && HAVE < NEED) {
    for (let p = HAVE + 1; p < NEED - 1; p++) for (let i = 1; i < w - 1; i++) if (((i + p) % 3) === 0) rect(x + i, slipY(p), 1, 1, K.loss);
  }
  for (let p = 0; p <= 100; p += 5) {
    const inInk = face && p <= pour;
    rect(x + 1, slipY(p), p % 10 === 0 ? 5 : 3, 1, inInk ? K['paper-shade'] : K.ink);
  }
  if (NEED !== null && NEED !== undefined) {
    const ry = slipY(NEED);
    const c = face && NEED <= pour ? K['paper-shade'] : K['price-ink'];
    if (o.hollow) { rect(x + 6, ry - 1, w - 6, 1, c); rect(x + 6, ry + 1, w - 6, 1, c); }
    else rect(x + 6, ry - 1, w - 6, 2, c);
  }
  if (face && o.showHave) {
    const inside = pour >= 24;
    const ty = inside ? slipY(pour) + 2 : slipY(Math.max(pour, (NEED || 0) + 2)) - 24; // short pours print above the price rule, never across it
    if (!inside) rect(x + 6, ty + 2, 28, 20, K.paper);
    text(String(HAVE), x + 7, ty - 3 + (inside ? 4 : 0), 2, inside ? K.paper : K.ink);
  }
  if (o.pencil !== null && o.pencil !== undefined) rect(x + 6, slipY(o.pencil), w - 8, 1, K['text-dim']);
  if (READ !== null && READ !== undefined) { // the read: a V cut through the paper
    const ny = slipY(READ); const t = drawTarget || ctx;
    [[-3, 1], [-2, 3], [-1, 5], [0, 6], [1, 5], [2, 3], [3, 1]].forEach(([dy, len]) => t.clearRect(R.ox + x, R.oy + ny + dy, len, 1));
  }
}
// the price, lit on the felt: a 3u tab of the rule past the slip's edge, the number at 2x in bulb amber
function priceTab(need) {
  const ry = slipY(need); const x = SLIP.x + SLIP.w;
  rect(x, ry - 1, 3, 2, K.bulb);
  rect(x, ry + 1, 3, 1, K.room);
  text(String(need), x + 5, ry - 21, 2, K.bulb);
  text('%', x + 5 + 28, ry - 9, 1, K.bulb);
}

// ---------- rail buttons (leather, 1u stitch row). pressed = value inversion, never a hue
function railButton(x, y, w, h, pressed) {
  rect(x, y + h, w, 1, K.room);
  rect(x, y, w, h, pressed ? K.text : K.rail);
  rect(x, y, w, 1, pressed ? K.text : K['rail-hi']);
  const st = pressed ? K['text-dim'] : K['rail-hi'];
  for (let i = x + 3; i < x + w - 3; i += 3) { rect(i, y + 2, 1, 1, st); rect(i, y + h - 3, 1, 1, st); }
}

function ease(n, N, kind) {
  const t = Math.max(0, Math.min(1, n / N));
  if (kind === 'SLIDE') return 1 - (1 - t) * (1 - t);
  if (kind === 'SWEEP') return t * t;
  return t;
}
function toUnits(ev) { const r = cv.getBoundingClientRect(); return { x: Math.floor((ev.clientX - r.left) * (cv.width / r.width)) - R.ox, y: Math.floor((ev.clientY - r.top) * (cv.height / r.height)) - R.oy }; }
function inBox(p, b) { return p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h; }

/* TITLE, direction A: the bulb is off. The first key or click catches it: 1 frame on, 2 off, then the pool
   resolves in 3 light steps of 3 frames. One slip lies under the bulb printed with one price rule. Nick it and it turns over, as it will at the table. */
TABLE.cx = 300; TABLE.cy = 206; TABLE.rx = 176; TABLE.ry = 96; TABLE.wear = null;
POOL.cx = 298; POOL.cy = 196; POOL.r1 = 52; POOL.r2 = 96;
SLIP.x = 280; SLIP.y = 138;
const MENU = ['play', 'drills', 'stats'];
const T_NEED = 25, T_HAVE = 19;
const params = new URLSearchParams(location.search);
let sel = 0, hoverMenu = -1, hover = null, tRead = null, tFrame = -1;
let lightFrame = params.get('state') === 'lit' || REDUCED ? 99 : -1;
const SEQ = [[true, 3], [false, 0], [false, 0], [true, 1], [true, 1], [true, 1], [true, 2], [true, 2], [true, 2]];
function menuBox(i) { return { x: 14, y: 104 + i * 28 + 4, w: MENU[i].length * 14 + 6, h: 25 }; }
function render() {
  const st = lightFrame < 0 ? [false, 0] : lightFrame < SEQ.length ? SEQ[lightFrame] : [true, 3];
  ctx.putImageData(room(st[0], st[1]), 0, 0);
  const lit = st[0];
  if (lit) {
    const after = tRead !== null;
    const n = after ? tFrame : -1;
    const fl = flipScale(n - 2);
    const pour = after ? Math.max(0, Math.min(T_HAVE, (n - 11) * 2)) : 0;
    const poured = after && (n - 11) * 2 >= T_HAVE;
    slip({ need: T_NEED, have: T_HAVE, read: tRead, face: after && fl.face, scaleX: fl.s, pour, showLoss: poured, showHave: poured, pencil: !after ? hover : null });
    if (st[1] === 3 && fl.s >= 1) priceTab(T_NEED);
  }
  text("pixel hold'em", 16, 12, 4, lit ? K.text : K['text-dim']);
  text('a no-limit trainer. bring your own odds.', 18, 64, 1, K['text-dim']);
  MENU.forEach((m, i) => {
    const y = 104 + i * 28;
    if ((i === sel) && lit) { const b = menuBox(i); rect(b.x, b.y, b.w, b.h, K.text); text(m, 17, y, 2, K.ink); }
    else text(m, 17, y, 2, lit ? (i === hoverMenu ? K.text : K.text) : K['text-dim']);
  });
  if (lit) {
    text('your miss: ±7', 18, 200, 1, K.text);
    text('over 212 reads', 18, 214, 1, K['text-dim']);
    text('61% of decisions read', 18, 228, 1, K['text-dim']);
  }
  text(lit ? '↑↓ choose · enter sit down' : 'press any key', 18, 276, 1, K['text-dim']);
}
function step() { lightFrame++; render(); if (lightFrame < SEQ.length) requestAnimationFrame(step); }
function catchBulb() { if (lightFrame >= 0) return false; if (REDUCED) { lightFrame = 99; render(); return true; } lightFrame = 0; render(); requestAnimationFrame(step); return true; }
function go() { if (sel === 0) location.href = 'table.html'; }
function nick(v) {
  tRead = v; hover = null;
  if (REDUCED) { tFrame = 99; render(); return; }
  tFrame = 0; const run = () => { tFrame++; render(); if (tFrame < 11 + Math.ceil(T_HAVE / 2) + 2) requestAnimationFrame(run); }; render(); requestAnimationFrame(run);
}
addEventListener('keydown', (e) => {
  if (catchBulb()) return;
  if (e.key === 'ArrowDown') { sel = (sel + 1) % MENU.length; render(); }
  if (e.key === 'ArrowUp') { sel = (sel + MENU.length - 1) % MENU.length; render(); }
  if (e.key === 'Enter') go();
});
cv.addEventListener('mousemove', (ev) => {
  if (lightFrame < SEQ.length) return;
  const p = toUnits(ev);
  hover = tRead === null && inBox(p, SLIP) ? Math.max(0, Math.min(100, SLIP.y + SLIP.base - p.y)) : null;
  const m = MENU.findIndex((_, i) => inBox(p, menuBox(i)));
  if (m >= 0) sel = m;
  cv.style.cursor = hover !== null ? 'crosshair' : m >= 0 ? 'pointer' : 'default';
  render();
});
cv.addEventListener('click', (ev) => {
  if (catchBulb()) return;
  const p = toUnits(ev);
  if (tRead === null && inBox(p, SLIP)) { nick(Math.max(0, Math.min(100, SLIP.y + SLIP.base - p.y))); return; }
  if (tRead !== null && inBox(p, SLIP)) { tRead = null; render(); return; }
  const m = MENU.findIndex((_, i) => inBox(p, menuBox(i))); if (m >= 0) { sel = m; render(); go(); }
});
function start() { resize(); clearRooms(); render(); }
addEventListener('resize', start);
document.fonts.load('11px DM').then(start, start);
